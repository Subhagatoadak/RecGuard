[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recguard-kernel"
version = "0.2.0"
description = "Portable policy-bound recommendation serving, telemetry and safe bandit experiment kernel"
readme = "README.md"
requires-python = ">=3.11"
# The embeddable kernel needs only Pydantic; the HTTP server is an extra.
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.30"]
yaml = ["pyyaml>=6"]  # YAML policy packs (JSON packs need nothing extra)
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pyyaml>=6"]

[project.scripts]
recguard = "recguard.__main__:main"

[tool.setuptools.packages.find]
include = ["recguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
