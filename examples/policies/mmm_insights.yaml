# Governance for LLM-written MMM readouts (examples/mmm_guarded_insights.ipynb).
# Host data passed in at load time: MMM (fitted results per channel), REGISTRY (governance
# facts per channel) and BASE_PLAN (next quarter's base spend, ₹ lakh).
recguard: 1
name: mmm-insights
description: Fact-check MMM insights; gate budget actions on uncertainty, confounding, margin, range and finance rules.
context: [MMM, REGISTRY, BASE_PLAN]

constants:
  insight_metrics: [roi, roi_low, roi_high, mroi, mroi_low, mroi_high, spend_share,
                    contribution_share, half_life_weeks, weeks_active, vif, max_spend_corr]
  fact_tolerance: 0.10          # cited numbers may differ from the MMM by 10% ...
  fact_abs_tolerance: 0.05      # ... or by 0.05, whichever is larger
  confounding_corr: 0.70        # spend correlation that makes attribution unidentifiable
  breakeven_mroi: 1.0           # increases need pessimistic marginal ROI at least this
  protect_mroi_low: 1.5         # never cut spend whose pessimistic marginal ROI exceeds this
  extrapolation_margin: 1.10    # planned quarter may exceed the highest observed quarter by 10%
  max_change_pct: 30
  max_test_pct: 10

policies:
  - policy_id: marketing-governance
    version: 1
    require_evidence: true
    require_consent_for_personalization: true
    denied_categories: [increase-on-brand-safety-hold]
    high_impact: true
    max_results: 20
  - policy_id: acmehealth-finance
    version: 1
    tenant_id: acmehealth
    purposes: [budget-plan]
    max_per_category: 1           # one action per channel
    min_score: 0.4
    max_results: 10
    min_results: 1
  - policy_id: acmehealth-insights
    version: 1
    tenant_id: acmehealth
    purposes: [mmm-insight]
    max_results: 12
    min_results: 1

checks:
  - name: fact-check
    description: Every number an insight cites must match the fitted MMM.
    applies_when: "startswith(item.item_id, 'insight-')"
    parse_item_id: '^insight-\d+:(?P<channel>[a-z0-9_]+):(?P<metric>[a-z0-9_]+):(?P<value>-?[0-9.]+)$'
    let:
      actual: "get(get(MMM, channel, {}), metric)"
    rules:
      - {reject: METRIC_NOT_IN_MMM, if: "actual is None or metric not in insight_metrics"}
      - reject: NUMBER_DOES_NOT_MATCH_MMM
        if: "abs(float(value) - actual) > max(fact_tolerance * abs(actual), fact_abs_tolerance)"

  - name: mmm
    description: Statistical guardrails on budget actions (channel:action:pct).
    applies_when: "not startswith(item.item_id, 'insight-')"
    parse_item_id: '^(?P<channel>[a-z0-9_]+):(?P<action>[a-z]+):(?P<pct>\d+)$'
    let:
      m: "MMM[channel]"
    rules:
      - {reject: CONFOUNDED_ATTRIBUTION_RUN_GEO_TEST, if: "action == 'increase' and m.max_spend_corr >= confounding_corr"}
      - {reject: INCREASE_NOT_PROFITABLE_AT_MARGIN, if: "action == 'increase' and m.mroi_low < breakeven_mroi"}
      - reject: EXTRAPOLATES_BEYOND_OBSERVED_SPEND
        if: "action == 'increase' and BASE_PLAN[channel] * (1 + pct / 100) > extrapolation_margin * m.max_quarter_spend_observed"
      - {reject: CUTS_CLEARLY_PROFITABLE_SPEND, if: "action == 'decrease' and m.mroi_low > protect_mroi_low"}

  - name: finance
    description: Quarterly change limits, test budgets and contract floors.
    applies_when: "not startswith(item.item_id, 'insight-')"
    parse_item_id: '^(?P<channel>[a-z0-9_]+):(?P<action>[a-z]+):(?P<pct>\d+)$'
    let:
      floor: "REGISTRY[channel].contract_floor_pct"
    rules:
      - {reject: TEST_BUDGET_ABOVE_10PCT, if: "action == 'test' and pct > max_test_pct"}
      - {reject: CHANGE_EXCEEDS_30PCT_QUARTERLY_LIMIT, if: "action != 'test' and pct > max_change_pct"}
      - {reject: BELOW_CONTRACTED_MINIMUM, if: "action == 'decrease' and floor is not None and -pct < floor"}

tests:
  - name: misquoted ROI is caught
    context: {MMM: {youtube: {roi: 4.55}}, REGISTRY: {}, BASE_PLAN: {}}
    item: {item_id: "insight-0:youtube:roi:6"}
    expect: fact-check:NUMBER_DOES_NOT_MATCH_MMM
  - name: confounded channel cannot be scaled
    context:
      MMM: {search: {max_spend_corr: 0.99, mroi_low: 1.2, max_quarter_spend_observed: 300}}
      REGISTRY: {search: {contract_floor_pct: null}}
      BASE_PLAN: {search: 200}
    item: {item_id: "search:increase:20"}
    expect: mmm:CONFOUNDED_ATTRIBUTION_RUN_GEO_TEST
  - name: TV cut below the contract floor
    context:
      MMM: {tv: {max_spend_corr: 0.99, mroi_low: 1.3, max_quarter_spend_observed: 500}}
      REGISTRY: {tv: {contract_floor_pct: -10}}
      BASE_PLAN: {tv: 450}
    item: {item_id: "tv:decrease:15"}
    expect: finance:BELOW_CONTRACTED_MINIMUM
  - name: profitable, unconfounded increase within range passes
    context:
      MMM: {retail_media: {max_spend_corr: 0.2, mroi_low: 2.7, max_quarter_spend_observed: 250}}
      REGISTRY: {retail_media: {contract_floor_pct: null}}
      BASE_PLAN: {retail_media: 172}
    item: {item_id: "retail_media:increase:20"}
    expect: null
